# ===================================
# AI News Digest - Docker Compose
# ===================================
#
# 使用方式:
#   定时模式: docker compose -f docker/docker-compose.yml up -d
#   API 模式: docker compose -f docker/docker-compose.yml up -d server

name: ai-news-digest

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  env_file:
    - ../.env

  volumes:
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../.env:/app/.env

  environment:
    - TZ=Asia/Shanghai

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:
  # 定时任务模式
  digest:
    <<: *common
    container_name: ai-news-digest

  # API 模式
  server:
    <<: *common
    container_name: ai-news-digest-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
